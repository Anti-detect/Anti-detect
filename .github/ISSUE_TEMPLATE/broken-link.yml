name: Broken link report
description: Report a 404 or wrong URL in README or docs
title: "[link]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: File or page
      placeholder: e.g. docs/open-source-catalog.md
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Broken URL
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: Expected fix
      options:
        - Update URL
        - Remove link
        - Replace with multilogin-automation repo
        - Unsure
    validations:
      required: true
