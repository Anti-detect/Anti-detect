# Synced to GitHub on push via .github/workflows/sync-labels.yml
documentation:
  color: "0075ca"
  description: "Documentation, README, or SEO improvements"
question:
  color: "d876e3"
  description: "Question or support request"
bug:
  color: "d73a4a"
  description: "Something is broken"
enhancement:
  color: "a2eeef"
  description: "New feature or request"
github-actions:
  color: "000000"
  description: "GitHub Actions or CI changes"
