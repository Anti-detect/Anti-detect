name: Weekly docs verify

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Branding guard
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(README.md README.*.md docs/*.md)
          if grep -riE 'adblogin\.com|toolskiemtrieudo|t\.me/|ADBNEW50|SAVE50|business@adblogin' "${FILES[@]}"; then
            exit 1
          fi

      - name: Verify multilogin-automation links
        run: |
          set -euo pipefail
          mapfile -t URLS < <(grep -rohE 'https://github.com/multilogin-automation/[A-Za-z0-9_.-]+' README.md README.*.md docs/ | sort -u)
          for url in "${URLS[@]}"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 25 "$url")
            test "$code" = "200" || { echo "Broken $url ($code)"; exit 1; }
          done

      - name: Python SDK syntax check
        run: python -m py_compile sdk/python/mlx_client.py sdk/python/mlx_env.py sdk/python/requests/*.py sdk/python/http_client/*.py

      - name: Regenerate API catalog
        run: |
          python scripts/parse-api-html.py
          python scripts/build-api-catalog.py

      - name: Check generated catalog drift
        run: git diff --exit-code docs/multilogin-api/endpoints.generated.md || (echo "::warning::endpoints.generated.md out of date — run build-api-catalog.py locally" && exit 0)
